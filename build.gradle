import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    // Spatial GUI's configuration screen (cloth-config) and the Mod Menu entry.
    maven { name = 'Cloth Config'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    // Minecraft 26.3 ships unobfuscated: no mappings, no remapping. The new
    // net.fabricmc.fabric-loom plugin does not remap Minecraft or mods, so plain
    // `implementation` replaces `modImplementation` and `jar` replaces `remapJar`.
    minecraft 'com.mojang:minecraft:' + project.minecraft_version
    implementation 'net.fabricmc:fabric-loader:' + project.loader_version
    implementation 'net.fabricmc.fabric-api:fabric-api:' + project.fabric_version
    // Spatial GUI base: configuration screen (hard dependency) + Mod Menu (optional).
    implementation 'me.shedaniel.cloth:cloth-config-fabric:' + project.cloth_config_version
    implementation 'com.terraformersmc:modmenu:' + project.modmenu_version

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    // Bytecode 21 keeps the Mixin compatibility level simple; the game and loader
    // require a Java 25 runtime regardless (declared in fabric.mod.json).
    it.options.release = 21
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Cloth Config and Mod Menu publish their variants with an explicit "built for
// Java 25" marker. Gradle matches that marker against this project's *target*
// bytecode level (21, see below) and would refuse them outright, so the class
// paths - the test ones included, since the unit tests load the very same
// configuration classes - declare the JVM they will actually run on. A library
// built for an older JVM still stays compatible, only newer ones are unlocked.
configurations.named('compileClasspath') {
    attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25) }
}
configurations.named('runtimeClasspath') {
    attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25) }
}
configurations.named('testCompileClasspath') {
    attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25) }
}
configurations.named('testRuntimeClasspath') {
    attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25) }
}

// End-to-end validation: `gradlew runClientGameTest` boots a client with
// -Dfabric.client.gametest in its own run directory (build/run/clientGameTest) and runs the
// entrypoint declared under "fabric-client-gametest" in fabric.mod.json.
fabricApi {
    configureTests {
        enableClientGameTests.set(true)
        // The mod only ships client game tests; the server harness has nothing to run.
        enableGameTests.set(false)
        // The test lives in src/main/java, no extra source set is needed.
        createSourceSet.set(false)
    }
}

// Every successful build drops the playable JAR into copy-jar-here/ using a name
// that encodes the Minecraft version, so several builds can coexist.
jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    // The Spatial GUI core is MIT: its licence travels with every copy of the jar.
    from("LICENSE.spatial-gui.txt")
    archiveFileName = "${project.base.archivesName.get()}-mc${project.minecraft_version}-v${project.version}.jar"
}

tasks.register('copyJarToDelivery', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into layout.projectDirectory.dir('copy-jar-here')
    // The file name already contains the Minecraft and mod version, so a rebuild of
    // the same version updates its own JAR and never clobbers another version.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

build.dependsOn tasks.named('copyJarToDelivery')
